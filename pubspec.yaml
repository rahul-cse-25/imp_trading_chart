name: imp_trading_chart
description: >
  A controller-driven trading line chart for Flutter with real-time updates, configurable gestures, and viewport-based CustomPainter rendering.

version: 0.2.1

homepage: https://github.com/rahul-cse-25/imp_trading_chart
repository: https://github.com/rahul-cse-25/imp_trading_chart
issue_tracker: https://github.com/rahul-cse-25/imp_trading_chart/issues

#screenshots:
#  - description: Trading chart with live updates
#    path: screenshots/pub/pub_dev.png

topics:
  - charts
  - trading
  - finance
  - visualization
  - flutter

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  meta: ^1.16.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

